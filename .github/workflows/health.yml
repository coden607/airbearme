name: Scheduled production health

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        id: check
        run: |
          set -o pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H 'Accept: application/json' \
            https://pwa4-seven.vercel.app/api/health | tee health.json
          jq -e '.status == "ok"' health.json

      - name: Open a deduplicated incident issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[health] Production health check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 10,
            });
            if (issues.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The scheduled production health check failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis issue is intentionally for human review; production logs must not directly rewrite or merge code.`,
            });
