name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # Type checking and linting
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Check for TypeScript errors
        run: |
          if npx tsc --noEmit 2>&1 | grep -q "error TS"; then
            echo "TypeScript errors found!"
            npx tsc --noEmit
            exit 1
          fi
          echo "✅ No TypeScript errors"

  # Build verification
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build successful"
            ls -la dist/
          else
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi

  # API endpoint tests
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and start server
        run: |
          npm run build
          npm start &
          sleep 10
        env:
          USE_MOCK_DATABASE: 'true'
          NODE_ENV: test
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost:5000/api/health)
          if echo "$response" | grep -q "ok"; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed: $response"
            exit 1
          fi

      - name: Test spots endpoint
        run: |
          response=$(curl -s http://localhost:5000/api/spots)
          count=$(echo "$response" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "✅ Spots endpoint working ($count spots)"
          else
            echo "❌ Spots endpoint failed"
            exit 1
          fi

      - name: Test airbears endpoint
        run: |
          response=$(curl -s http://localhost:5000/api/airbears)
          count=$(echo "$response" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "✅ Airbears endpoint working ($count vehicles)"
          else
            echo "❌ Airbears endpoint failed"
            exit 1
          fi

      - name: Test bodega endpoint
        run: |
          response=$(curl -s http://localhost:5000/api/bodega-items)
          count=$(echo "$response" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "✅ Bodega endpoint working ($count items)"
          else
            echo "❌ Bodega endpoint failed"
            exit 1
          fi

  # Deploy to Vercel (only on main branch)
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [typecheck, build, api-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Verify deployment
        run: |
          sleep 30
          response=$(curl -s https://pwa4-seven.vercel.app/api/health)
          if echo "$response" | grep -q "ok"; then
            echo "✅ Production deployment verified"
          else
            echo "⚠️ Production health check inconclusive"
          fi
