<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Assignment Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🚗 AirBear Vehicle Assignment Test</h1>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <div id="results"></div>
    </div>

    <div class="test-section">
        <h2>Manual Test</h2>
        <button onclick="testVehicleAssignment()">Test Vehicle Assignment</button>
        <button onclick="checkAirbears()">Check AirBears</button>
        <div id="manual-results"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5000';
        let testDriver = null;

        function addResult(message, isSuccess = true) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-section ${isSuccess ? 'success' : 'error'}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            results.appendChild(div);
        }

        function addManualResult(content) {
            const results = document.getElementById('manual-results');
            results.innerHTML = `<pre>${content}</pre>`;
        }

        async function createTestDriver() {
            try {
                const timestamp = Date.now();
                const driver = {
                    username: `testdriver_${timestamp}`,
                    email: `test${timestamp}@example.com`,
                    password: 'password123',
                    confirmPassword: 'password123',
                    fullName: 'Test Driver',
                    role: 'driver'
                };

                const registerRes = await fetch(`${BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(driver)
                });

                if (!registerRes.ok) {
                    throw new Error('Driver creation failed');
                }

                const driverData = await registerRes.json();
                
                // Login
                const loginRes = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: driver.email,
                        password: driver.password
                    })
                });

                if (!loginRes.ok) {
                    throw new Error('Login failed');
                }

                testDriver = driverData.user;
                addResult(`✅ Test driver created and logged in: ${testDriver.id.slice(0, 8)}`);
                return testDriver;
            } catch (error) {
                addResult(`❌ Driver setup failed: ${error.message}`, false);
                return null;
            }
        }

        async function testVehicleAssignment() {
            if (!testDriver) {
                await createTestDriver();
                if (!testDriver) return;
            }

            try {
                addResult('🔄 Testing vehicle assignment...');

                // Get available AirBears (like frontend does)
                const airbearsRes = await fetch(`${BASE_URL}/api/airbears`);
                const airbears = await airbearsRes.json();
                const available = airbears.find(a => 
                    !a.driverId && !a.driver_id && (a.isAvailable ?? a.is_available ?? a.isavailable)
                );

                if (!available) {
                    addResult('❌ No available AirBears found', false);
                    return;
                }

                addResult(`📝 Found available AirBear: ${available.id.slice(0, 8)}`);

                // Simulate the frontend claimAirbear function
                const updateRes = await fetch(`${BASE_URL}/api/airbears/${available.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ driverId: testDriver.id }),
                });

                if (updateRes.ok) {
                    const updated = await updateRes.json();
                    addResult(`✅ Assignment successful!`);
                    addResult(`📊 Response structure: ${Object.keys(updated).join(', ')}`);
                    
                    // Test the fix: check if we can access the data
                    const airbearData = updated.data || updated;
                    addResult(`🔧 Fix verification: ${updated.data ? '✅ Has data property' : '⚠️ No data property'}`);
                    addResult(`🚗 Assigned AirBear: ${airbearData.id?.slice(0, 8)} to driver: ${airbearData.driverId?.slice(0, 8)}`);
                } else {
                    const errorText = await updateRes.text();
                    addResult(`❌ Assignment failed: ${errorText}`, false);
                }

            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, false);
            }
        }

        async function checkAirbears() {
            try {
                const res = await fetch(`${BASE_URL}/api/airbears`);
                const airbears = await res.json();
                
                const available = airbears.filter(a => 
                    !a.driverId && !a.driver_id && (a.isAvailable ?? a.is_available ?? a.isavailable)
                );
                
                const assigned = airbears.filter(a => a.driverId || a.driver_id);
                
                const output = `Total AirBears: ${airbears.length}
Available: ${available.length}
Assigned: ${assigned.length}

Available AirBears:
${available.map(a => `- ${a.id?.slice(0, 8)} (Battery: ${a.batteryLevel}%)`).join('\n')}

Assigned AirBears:
${assigned.map(a => `- ${a.id?.slice(0, 8)} → Driver: ${a.driverId?.slice(0, 8) || a.driver_id?.slice(0, 8)}`).join('\n')}`;

                addManualResult(output);
            } catch (error) {
                addManualResult(`Error: ${error.message}`);
            }
        }

        // Auto-run initial check
        window.onload = () => {
            addResult('🚀 Vehicle Assignment Test Page Loaded');
            checkAirbears();
        };
    </script>
</body>
</html>
